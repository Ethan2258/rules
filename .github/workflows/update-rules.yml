name: Update rules

on:
  schedule:
    # GitHub delays or skips scheduled runs when busy, so check hourly (off the
    # top of the hour) to keep real gaps short. Keep README.md in sync.
    - cron: "41 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/update-rules.yml"

permissions:
  contents: write

concurrency:
  group: update-rules-${{ github.ref }}
  # Only pull request dry runs are superseded; an update run finishes its push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Generate rule sets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_rules.py

      - name: Validate generated files
        run: |
          python -m pip install --disable-pip-version-check --requirement .github/requirements.txt
          python .github/scripts/validate_repository.py

      - name: Show generated changes
        if: github.event_name == 'pull_request'
        run: |
          git status --short
          git diff -- .github/rule-artifacts.json

      - name: Commit updated rule sets
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          mapfile -t files < <(jq -r '.rule_sets[].files | keys[]' .github/rule-artifacts.json)
          files+=(.github/rule-artifacts.json)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Generated rule files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          # Read by the purge step, which only runs once this step (and the push) succeeds.
          echo "changed=$(git diff --cached --name-only | paste -sd ' ')" >> "$GITHUB_OUTPUT"
          git commit -m "chore: update generated rule files"
          # main may have moved while the rules were being built.
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase --quiet
          done
          git push

      # jsDelivr caches branch files for up to 12 hours; purge what just changed so
      # clients pulling through the CDN get the new rules on their next refresh.
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed != ''
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          CDN_PATH: gh/${{ github.repository }}@${{ github.ref_name }}
        run: |
          for file in $CHANGED; do
            url="https://purge.jsdelivr.net/$CDN_PATH/$file"
            if ! response="$(curl -fsS --retry 3 --retry-all-errors --max-time 30 "$url")"; then
              echo "::warning::jsDelivr purge failed for $file"
            elif jq -e '[.paths[]?.throttled] | any' <<< "$response" > /dev/null; then
              echo "::warning::jsDelivr throttled the purge for $file"
            else
              echo "Purged $file"
            fi
          done

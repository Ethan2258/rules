name: Sync Mihomo rules

on:
  schedule:
    # 02:00 UTC is 10:00 China Standard Time.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mihomo-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify upstream rules
        shell: bash
        run: |
          set -euo pipefail

          download_mrs() {
            local destination="$1"
            local source_url="$2"
            local temporary
            local magic

            temporary="$(mktemp)"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 60 \
              --retry 3 \
              --retry-all-errors \
              --retry-max-time 180 \
              --output "$temporary" \
              "$source_url"

            test -s "$temporary"
            magic="$(od -An -tx1 -N4 "$temporary" | tr -d ' \n')"
            if [[ "$magic" != "28b52ffd" ]]; then
              echo "Invalid MRS/Zstandard header from $source_url" >&2
              rm -f "$temporary"
              return 1
            fi

            mv "$temporary" "$destination"
          }

          download_mrs \
            "ai_domain.mrs" \
            "https://raw.githubusercontent.com/milangree/rules/main/rules/mihomo/ai/ai_domain.mrs"
          download_mrs \
            "ai_ipcidr.mrs" \
            "https://raw.githubusercontent.com/milangree/rules/main/rules/mihomo/ai/ai_ipcidr.mrs"
          download_mrs \
            "Webrtc_domain.mrs" \
            "https://raw.githubusercontent.com/milangree/rules/main/rules/mihomo/Webrtc/Webrtc_domain.mrs"

      - name: Commit updated rules
        shell: bash
        run: |
          set -euo pipefail

          git add -- ai_domain.mrs ai_ipcidr.mrs Webrtc_domain.mrs
          if git diff --staged --quiet; then
            echo "Rule files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(rules): sync upstream Mihomo rules"
          git push

name: Update generated rules

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-mihomo-rules
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install SRS compression dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: zopfli==0.4.3

      - name: Download and convert source rules
        run: python .github/scripts/update_lsr_rules.py

      - name: Commit updated rule files
        run: |
          if ! git status --porcelain -- .github/speedtest-source-state.json Nodeseek.yaml Nodeseek.srs Webrtc_domain.mrs Webrtc_domain.srs SpeedtestInternational.mrs SpeedtestInternational.srs SpeedtestInternational_ipcidr.mrs SpeedtestInternational_ipcidr.srs TelegramSG.mrs TelegramSG.srs TelegramNL.mrs TelegramNL.srs | grep -q .; then
            echo "Generated rule files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/speedtest-source-state.json Nodeseek.yaml Nodeseek.srs Webrtc_domain.mrs Webrtc_domain.srs SpeedtestInternational.mrs SpeedtestInternational.srs SpeedtestInternational_ipcidr.mrs SpeedtestInternational_ipcidr.srs TelegramSG.mrs TelegramSG.srs TelegramNL.mrs TelegramNL.srs
          git commit -m "chore: update generated rule files"
          git push

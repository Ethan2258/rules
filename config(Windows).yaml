# —————————
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
ipv6: true
lgbm-url: "https://v6.gh-proxy.org/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"
allow-lan: true
bind-address: "*" 
geodata-loader: mem
geo-auto-update: true
geo-update-interval: 24
geox-url:
  asn: "https://v6.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
unified-delay: true
tcp-concurrent: true
tcp-keep-alive-idle: 15
tcp-keep-alive-interval: 15
log-level: error
find-process-mode: strict
external-controller: 0.0.0.0:9090 
external-ui-url: "https://v6.gh-proxy.org/https://github.com/musiyun124/zashboard/archive/refs/heads/gh-pages-no-fonts.zip"
external-ui: "./webroot/Zash/"
# —————————
p: &p
  type: http
  interval: 1800
  health-check:
    enable: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
  proxy: 🌐 國內直連
  header: 
      User-Agent:  
        - "ClashMetaForAndroid/v2.11.27"
# —————————
A: &A
  url: "https://www.gstatic.com/generate_204"
  interval: 300
  use:
  - 花雲
  - Turing
  - Sub
  - 肯の机
  - Dragonfly
All: &All
  type: smart
  url: "https://www.gstatic.com/generate_204"
  interval: 300
  uselightgbm: true      
  sample-rate: 1
  prefer-asn: true
  tolerance: 3
  use:
  - 花雲
  - Turing
  - Sub
  - 肯の机
  - Dragonfly
proxy-providers: 
  花雲: 
    <<: *p
    override:
      additional-prefix: "花雲: "
      udp: true
    path: ./proxy_provider/花雲.yaml
    url: "http://127.0.0.1:38324/download/%E8%8A%B1%E4%BA%91"
  Turing:
    <<: *p
    override:
      additional-prefix: "Turing: "
      udp: true
    path: ./proxy_provider/Turing.yaml
    url: "http://127.0.0.1:38324/download/Turing"
  Dragonfly:
    <<: *p
    override:
      additional-prefix: "Dragonfly: "
      udp: true
    path: ./proxy_provider/Dragonfly.yaml
    url: "http://127.0.0.1:38324/download/Dragonfly"  
  Sub:
    <<: *p
    override:
      additional-prefix: "Sub: "
      udp: true
    path: ./proxy_provider/Sub.yaml
    url: "http://127.0.0.1:38324/download/collection/Sub"  
  肯の机:
    <<: *p
    override:
      additional-prefix: "肯の机: "
      udp: true
    path: ./proxy_provider/肯の机.yaml
    url: "http://127.0.0.1:38324/download/%E8%82%AF%E3%81%AE%E6%9C%BA"
profile: 
  store-selected: true
  store-fake-ip: true
# —————————
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false 
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true 
    TLS:
      ports: [443, 5228, 8443]   
    QUIC:
      ports: [443, 8443]
# —————————
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-ipv6: true
  respect-rules: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::/48
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,Fake-IP-Filter,real-ip
    - RULE-SET,Private_域,real-ip
    - RULE-SET,Direct_域,real-ip
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:Direct_域,Private_域,Fake-IP-Filter":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
# —————————
proxies:
  - {name: 🌐 國內直連, type: direct, udp: true, ip-version: ipv6-prefer}
  - {name: ⛔️ 禁止連接, type: reject}
  - {name: 🌐 DNS劫持, type: dns}
# —————————
proxy_groups: &proxy_groups
    type: select
    proxies:
      - 總模式
      - Hong Kong
      - Taiwan
      - Sub
      - Singapore
      - Europe
    <<: *A
# —————————
proxy-groups:
  - name: 總模式
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final_1.png"
    type: select
    proxies:
      - Hong Kong
      - Taiwan
      - Sub
      - Singapore
      - Europe
      - 🌐 國內直連
  - name: Proxy
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    <<: *proxy_groups
  - name: AI
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png"
    <<: *proxy_groups
  - name: Telegram
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram_X.png"
    <<: *proxy_groups
  - name: Speedtest
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png"
    <<: *proxy_groups
  - name: Nodeseek
    icon: "https://cdn.jsdelivr.net/gh/Ethan2258/Ethan2258@main/nodeseek.svg"
    <<: *proxy_groups
  - name: Hong Kong
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"
    filter: "^(?=.*(🇭🇰))(?!.*(HKT)).*$"
    <<: *All 
  - name: YouTube
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"
    <<: *proxy_groups  
  - name: Taiwan
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"
    filter: "^(?=.*(🇹🇼))(?!.*(Seednet|HiNet)).*$"
    <<: *All 
  - name: Sub
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png"
    filter: "^(?=.*(HKT|Seednet|HiNet)).*$"
    type: select
    use:
    - Sub
  - name: Singapore
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"
    filter: "^(?=.*(🇸🇬)).*$"
    <<: *All
  - name: Europe
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/European_Union.png"
    filter: "^(?=.*(🇳🇱|🇩🇪|🇫🇷)).*$"
    <<: *All
# —————————
rule-anchor:
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: 3600, proxy: Proxy}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: 3600, proxy: Proxy}
  Classical: &Classical 
    {type: http, behavior: classical, format: yaml, interval: 3600, proxy: Proxy}
# —————————
rule-providers:
  Private_域:
    <<: *Domain
    path: ./rule_provider/Private_域.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/private.mrs"
  Private_IP:
    <<: *IPCIDR
    path: ./rule_provider/Private_IP.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.mrs"
    
  AD_域:
    <<: *Domain
    path: ./rule_provider/AD_域.mrs
    url: "https://cdn.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockmihomo.mrs" 
  AD_IP:
    <<: *IPCIDR
    path: ./rule_provider/AD_IP.mrs
    url: "https://cdn.jsdelivr.net/gh/xndeye/rule-merger@release/reject@ip.mrs"        
  WebRTC:
    <<: *Classical
    path: ./rule_provider/WebRTC.yaml
    url: "https://cdn.jsdelivr.net/gh/Ethan2258/Ethan2258@main/webrtc.yaml"        
    
  AI:
    <<: *Domain
    path: ./rule_provider/AI.mrs
    url: "https://fastly.jsdelivr.net/gh/xndeye/rule-merger@release/ai.mrs"
  Claude:
    <<: *Classical 
    path: ./rule_provider/Claude.yaml
    url: "https://cdn.jsdelivr.net/gh/Ethan2258/Ethan2258@main/Claude.yaml"  
  
  YouTube:
    <<: *Domain
    path: ./rule_provider/YouTube.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/youtube.mrs"

  Telegram:
    <<: *Domain
    path: ./rule_provider/Telegram.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs"  
     
  Speedtest:
    <<: *Domain
    path: ./rule_provider/Speedtest.mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/speedtest.mrs"  
    
  Nodeseek:
    <<: *Classical 
    path: ./rule_provider/Nodeseek.yaml
    url: "https://fastly.jsdelivr.net/gh/Ethan2258/Ethan2258@main/Nodeseek.yaml"  
    
  Direct_IP:
    <<: *IPCIDR
    path: ./rule_provider/Direct_IP.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.mrs"
  Direct_域:
    <<: *Domain
    path: ./rule_provider/Direct_域.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.mrs"
    
  Fake-IP-Filter:
    <<: *Domain
    path: ./rule_provider/Fake-IP-Filter.mrs
    url: "https://fastly.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/fakeip-filter.mrs"   
# —————————
rules:
  - DST-PORT,53,🌐 DNS劫持
  - DST-PORT,853,總模式

  - OR,((RULE-SET,Private_域),(RULE-SET,Private_IP,no-resolve)),🌐 國內直連
  
  - PROCESS-NAME,sub_store_node,🌐 國內直連
 
  - OR,((RULE-SET,AD_域),(RULE-SET,AD_IP,no-resolve),(RULE-SET,WebRTC)),⛔️ 禁止連接

  - OR,((RULE-SET,AI),(RULE-SET,Claude)),AI

  - RULE-SET,YouTube,YouTube 

  - OR,((PROCESS-NAME-WILDCARD,*telegram*),(RULE-SET,Telegram)),Telegram 

  - RULE-SET,Nodeseek,Nodeseek
  
  - RULE-SET,Speedtest,Speedtest

  - OR,((RULE-SET,Direct_域),(RULE-SET,Direct_IP,no-resolve)),🌐 國內直連
  
  - MATCH,Proxy
# —————————

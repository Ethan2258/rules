# —————————
mixed-port: 7890
redir-port: 9797
tproxy-port: 9898
ipv6: true
prefer-ipv6: true
lgbm-url: "https://v6.gh-proxy.org/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model-large.bin"
allow-lan: true
bind-address: "*" 
geodata-loader: mem
geo-auto-update: true
geo-update-interval: 24
geox-url:
  asn: "https://v6.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
experimental:
  mptcp: true
  udp-fallback-match: true
unified-delay: true
tcp-concurrent: true
log-level: silent 
find-process-mode: strict
external-controller: 0.0.0.0:9090 
external-ui-url: "https://v6.gh-proxy.org/https://github.com/musiyun124/zashboard/archive/refs/heads/gh-pages-no-fonts.zip"
external-ui: "./webroot/Zash/"
# —————————
p: &p
  type: http
  interval: 1800
  health-check:
    enable: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
  proxy: 訂閱更新
  header: 
      User-Agent:  
        - "ClashMetaForAndroid/v2.11.27"
# —————————
A: &A
  url: "https://www.gstatic.com/generate_204"
  interval: 300
  use:
  - 花雲
  - Turing
  - IX
  - Local
  - 肯の机
  - Dragonfly
All: &All
  type: smart
  url: "https://www.gstatic.com/generate_204"
  interval: 60           
  uselightgbm: true      
  sample-rate: 1
  collectdata: true
  prefer-asn: true
  tolerance: 0        
  use:
  - 花雲
  - Turing
  - IX
  - Local
  - 肯の机
  - Dragonfly
proxy-providers: 
  花雲: 
    <<: *p
    override:
      additional-prefix: "花雲："
      udp: true
    path: ./proxy_provider/花雲.yaml
    url: "http://127.0.0.1:38324/download/%E8%8A%B1%E4%BA%91"
  Turing:
    <<: *p
    override:
      additional-prefix: "Turing："
      udp: true
    path: ./proxy_provider/Turing.yaml
    url: "http://127.0.0.1:38324/download/Turing"
  IX:
    <<: *p
    override:
      additional-prefix: "IX："
      udp: true
    path: ./proxy_provider/IX.yaml
    url: "http://127.0.0.1:38324/download/IX"  
  Dragonfly:
    <<: *p
    override:
      additional-prefix: "Dragonfly："
      udp: true
    path: ./proxy_provider/Dragonfly.yaml
    url: "http://127.0.0.1:38324/download/Dragonfly"  
  Local:
    <<: *p
    override:
      additional-prefix: "Local："
      udp: true
    path: ./proxy_provider/Local.yaml
    url: "http://127.0.0.1:38324/download/collection/Local"  
  肯の机:
    <<: *p
    override:
      additional-prefix: "肯の机："
      udp: true
    path: ./proxy_provider/肯の机.yaml
    url: "http://127.0.0.1:38324/download/%E8%82%AF%E3%81%AE%E6%9C%BA"  
profile: 
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 100
# —————————
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
# —————————
dns:
  enable: true
  cache-algorithm: arc
  ipv6: true
  prefer-ipv6: true
  ipv6-timeout: 300
  respect-rules: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::/48
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,Fake-IP-Filter,real-ip
    - RULE-SET,Private_域,real-ip
    - RULE-SET,Direct_域,real-ip
  default-nameserver:
    - 223.5.5.5
    - 1.12.12.12
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "RULE-SET:Direct_域":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query#h3=true
    - https://dns.google/dns-query#h3=true
# —————————
proxies:
  - {name: 🌐 國內直連, type: direct, udp: true, ip-version: ipv6-prefer}
  - {name: ⛔️ 禁止連接, type: reject}
  - {name: 🌐 DNS劫持, type: dns}
# —————————
proxy_groups: &proxy_groups
    type: select
    proxies:
      - 總模式
      - Hong Kong 
      - Taiwan 
      - Japan 
      - Sub
      - Singapore 
      - Europe
      - America
    <<: *A
# —————————
proxy-groups:
  - name: 總模式
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final_1.png"
    type: select
    proxies:
      - Hong Kong 
      - Taiwan 
      - Japan
      - Sub
      - Singapore
      - Europe
      - America 
      - 🌐 國內直連
  - name: 訂閱更新
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Download.png"
    type: select
    proxies:
      - 🌐 國內直連
      - 總模式
  - name: Proxy
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
    <<: *proxy_groups
  - name: GoogleFCM
    icon: "https://gh-proxy.org/https://github.com/Ethan2258/Ethan2258/raw/refs/heads/main/Logomark_Full%20Color.svg"
    type: select
    proxies:
      - 🌐 國內直連
      - 總模式
  - name: Google
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png"
    <<: *proxy_groups
  - name: AI
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/AI.png"
    <<: *proxy_groups
  - name: Telegram 
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram_X.png"
    <<: *proxy_groups
  - name: Speedtest 
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png"
    <<: *proxy_groups
  - name: Hong Kong 
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"
    filter: "^(?=.*(🇭🇰))(?!.*(HKT|IX)).*$"
    <<: *All
  - name: Sub
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png"
    filter: "^(?!.*(CN2|直连)).*$"
    type: select 
    use:
    - Local
    - IX
    - Dragonfly
  - name: Taiwan 
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png"
    filter: "^(?=.*(🇹🇼))(?!.*(Seednet|Hinet|IX)).*$"
    <<: *All
  - name: Japan 
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png"
    filter: "^(?=.*(🇯🇵))(?!.*(Local)).*$"
    <<: *All
  - name: Singapore 
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png"
    filter: "^(?=.*(🇸🇬))(?!.*(Local)).*$"
    <<: *All
  - name: Europe
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/European_Union.png"
    filter: "^(?=.*(🇳🇱|🇩🇪|🇫🇷|🇬🇧)).*$"
    <<: *All
  - name: America
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/America_Map.png"
    filter: "^(?=.*(🇺🇸|🇨🇦))(?!.*(Local)).*$"
    <<: *All   
# —————————
rule-anchor:
  IPCIDR: &IPCIDR
    {type: http, behavior: ipcidr, format: mrs, interval: 3600}
  Domain: &Domain
    {type: http, behavior: domain, format: mrs, interval: 3600}
  Classical: &Classical 
    {type: http, behavior: domain, format: yaml, interval: 3600}
# —————————
rule-providers:
  WebRTC:
    <<: *Domain
    path: ./rule_provider/WebRTC.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/webrtc/webrtc_domain.mrs"     
    
  Direct_IP:
    <<: *IPCIDR
    path: ./rule_provider/Direct_IP.mrs
    url: "https://fastly.jsdelivr.net/gh/xndeye/rule-merger@release/direct@ip.mrs"
  Direct_域:
    <<: *Domain
    path: ./rule_provider/Direct_域.mrs
    url: "https://fastly.jsdelivr.net/gh/xndeye/rule-merger@release/direct.mrs" 
    
  No-ads-all_域:
    <<: *Domain
    path: ./rule_provider/No-ads-all_域.mrs
    url: "https://cdn.jsdelivr.net/gh/217heidai/adblockfilters@main/rules/adblockmihomo.mrs" 
  No-ads-all_IP:
    <<: *IPCIDR
    path: ./rule_provider/No-ads-all_IP.mrs
    url: "https://cdn.jsdelivr.net/gh/xndeye/rule-merger@release/reject@ip.mrs"    
    
  Google_域:
    <<: *Domain
    path: ./rule_provider/Google.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/domain_google/domain_google_domain.mrs"
  Google_IP:
    <<: *IPCIDR
    path: ./rule_provider/Google_IP.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/ipcidr_google/ipcidr_google_ipcidr.mrs"
  YouTube:
     <<: *Domain
     path: ./rules/YouTube.mrs
     url: "https://fastly.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/domain_youtube/domain_youtube_domain.mrs"  
  
  Telegram:
     <<: *Domain
     path: ./rules/Telegram.mrs
     url: "https://fastly.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/Telegram/Telegram_domain.mrs"  
    
  AI:
    <<: *Domain
    path: ./rule_provider/AI.mrs
    url: "https://fastly.jsdelivr.net/gh/xndeye/rule-merger@release/ai.mrs"
  Claude:
    <<: *Classical 
    path: ./rule_provider/Claude.yaml
    url: "https://cdn.jsdelivr.net/gh/Ethan2258/Ethan2258@main/Claude.yaml"  
    
  Private_域:
    <<: *Domain
    path: ./rule_provider/Private_域.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/domain_private/domain_private_domain.mrs"
  Private_IP:
    <<: *IPCIDR
    path: ./rule_provider/Private_IP.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/ipcidr_private/ipcidr_private_ipcidr.mrs"
    
  Fake-IP-Filter:
    <<: *Domain
    path: ./rule_provider/Fake-IP-Filter.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/domain_fake-ip-filter/domain_fake-ip-filter_domain.mrs"

  Speedtest:
    <<: *Domain
    path: ./rule_provider/Speedtest.mrs
    url: "https://cdn.jsdelivr.net/gh/milangree/rules@main/rules/mihomo/domain_speedtest/domain_speedtest_domain.mrs"  
# —————————
rules:
  - DST-PORT,53,🌐 DNS劫持
  - DST-PORT,853,總模式

  - OR,((RULE-SET,Private_域),(RULE-SET,Private_IP,no-resolve)),🌐 國內直連

  - OR,((RULE-SET,No-ads-all_域),(RULE-SET,No-ads-all_IP),(DST-PORT,3478),(DST-PORT,19302),(RULE-SET,WebRTC)),⛔️ 禁止連接
  
  - RULE-SET,Telegram,Telegram 

  - OR,((RULE-SET,AI),(RULE-SET,Claude)),AI
  
  - OR,((RULE-SET,Google_域),(RULE-SET,Google_IP,no-resolve)),Google

  - DOMAIN-KEYWORD,nodeseek,Europe
  - RULE-SET,Speedtest,Speedtest

  - OR,((RULE-SET,Direct_域),(RULE-SET,Direct_IP,no-resolve)),🌐 國內直連
  
  - MATCH,Proxy
# —————————
